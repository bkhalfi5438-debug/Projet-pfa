<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تدبير الرخص - Projet PFA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div class="container mt-4">
        <h2 class="mb-4 text-primary">📄 تدبير الرخص والتراخيص</h2>

        <!-- Formulaire d'ajout -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                إضافة رخصة جديدة
            </div>
            <div class="card-body">
                <form id="formAutorisation">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">رقم الملف</label>
                            <input type="text" class="form-control" name="numero_dossier" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">اسم المواطن / المقاولة</label>
                            <input type="text" class="form-control" name="nom_contribuable" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">نوع الرخصة</label>
                            <select class="form-select" name="type_autorisation" required>
                                <option value="">اختر النوع</option>
                                <option value="رخصة البناء">رخصة البناء</option>
                                <option value="رخصة الاستغلال">رخصة الاستغلال</option>
                                <option value="رخصة الاحتلال المؤقت">الاحتلال المؤقت</option>
                                <option value="رخصة الإعلان">رخصة الإعلان</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">تاريخ الإيداع</label>
                            <input type="date" class="form-control" name="date_depot" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">المبلغ بالدرهم</label>
                            <input type="number" class="form-control" name="montant" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">الحالة</label>
                            <select class="form-select" name="statut">
                                <option value="قيد المعالجة">قيد المعالجة</option>
                                <option value="مقبولة">مقبولة</option>
                                <option value="مرفوضة">مرفوضة</option>
                                <option value="مؤداة">مؤداة</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3 d-flex align-items-end">
                            <button type="submit" class="btn btn-success w-100">حفظ الرخصة</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tableau des autorisations -->
        <div class="card shadow-sm">
            <div class="card-header bg-secondary text-white">
                لائحة الرخص
            </div>
            <div class="card-body">
                <table class="table table-hover table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>رقم الملف</th>
                            <th>الاسم</th>
                            <th>نوع الرخصة</th>
                            <th>تاريخ الإيداع</th>
                            <th>المبلغ DH</th>
                            <th>الحالة</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="tableAutorisations">
                        <tr>
                            <td>2026-001</td>
                            <td>شركة البناء الحديث</td>
                            <td>رخصة البناء</td>
                            <td>2026-08-15</td>
                            <td>5000</td>
                            <td><span class="badge bg-warning">قيد المعالجة</span></td>
                            <td>
                                <button class="btn btn-sm btn-primary">تعديل</button>
                                <button class="btn btn-sm btn-danger">حذف</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/autorisations.js"></script>
</body>
</html>
