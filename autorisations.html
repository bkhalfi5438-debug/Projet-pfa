<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Autorisations - Projet PFA</title>
   <link href="/Projet-pfa/css/style.css" rel="stylesheet">
<script src="/Projet-pfa/js/autorisations.js"></script>
</head>
<body class="bg-light">

    <div class="container mt-4">
        <h2 class="mb-4 text-primary">📄 Gestion des Autorisations et Permis</h2>

        <!-- Formulaire d'ajout -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                Ajouter une nouvelle Autorisation
            </div>
            <div class="card-body">
                <form id="formAutorisation">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Numéro de Dossier</label>
                            <input type="text" class="form-control" name="numero_dossier" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Nom du Citoyen / Entreprise</label>
                            <input type="text" class="form-control" name="nom_contribuable" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Type d'Autorisation</label>
                            <select class="form-select" name="type_autorisation" required>
                                <option value="">Choisir le type</option>
                                <option value="Permis de Construire">Permis de Construire</option>
                                <option value="Licence d'Exploitation">Licence d'Exploitation</option>
                                <option value="Occupation Temporaire">Occupation Temporaire</option>
                                <option value="Autorisation de Publicité">Autorisation de Publicité</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Date de Dépôt</label>
                            <input type="date" class="form-control" name="date_depot" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Montant en DH</label>
                            <input type="number" class="form-control" name="montant" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Statut</label>
                            <select class="form-select" name="statut">
                                <option value="En cours de traitement">En cours de traitement</option>
                                <option value="Approuvé">Approuvé</option>
                                <option value="Rejeté">Rejeté</option>
                                <option value="Payé">Payé</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3 d-flex align-items-end">
                            <button type="submit" class="btn btn-success w-100">Enregistrer</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tableau des autorisations -->
        <div class="card shadow-sm">
            <div class="card-header bg-secondary text-white">
                Liste des Autorisations
            </div>
            <div class="card-body">
                <table class="table table-hover table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>N° Dossier</th>
                            <th>Nom</th>
                            <th>Type d'Autorisation</th>
                            <th>Date de Dépôt</th>
                            <th>Montant DH</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableAutorisations">
                        <tr>
                            <td>2026-001</td>
                            <td>Société Bâtiment Moderne</td>
                            <td>Permis de Construire</td>
                            <td>2026-08-15</td>
                            <td>5000</td>
                            <td><span class="badge bg-warning text-dark">En cours</span></td>
                            <td>
                                <button class="btn btn-sm btn-primary">Modifier</button>
                                <button class="btn btn-sm btn-danger">Supprimer</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/autorisations.js"></script>
</body>
</html>
