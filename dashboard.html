<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; font-family: 'Segoe UI', sans-serif; }
        .sidebar { width: 250px; background: #1e2a4a; min-height: 100vh; color: white; position: fixed; left: 0; top: 0; }
        .sidebar-header { padding: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #2e3a5a; font-weight: bold; }
        .sidebar .nav-link { color: #a0aec0; padding: 12px 20px; display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #2e3a5a; color: white; border-left: 3px solid #3b82f6; }
        .main-content { margin-left: 250px; padding: 25px; }
        .topbar { display: flex; justify-content: space-between; margin-bottom: 25px; align-items: center; }
        .stat-card { padding: 20px; border-radius: 12px; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .stat-card h6 { font-size: 14px; opacity: 0.9; }
        .stat-card h3 { font-size: 28px; font-weight: bold; margin: 0; }
        .stat-card.blue { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .stat-card.green { background: linear-gradient(135deg, #10b981, #059669); }
        .stat-card.orange { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .stat-card.red { background: linear-gradient(135deg, #ef4444, #dc2626); }
    </style>
</head>
<body>
<div class="d-flex">
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-header"><i class="bi bi-building fs-4"></i><span>Administration Fiscale</span></div>
        <ul class="nav flex-column mt-3">
            <li><a class="nav-link active" href="dashboard.html"><i class="bi bi-grid"></i> Dashboard</a></li>
            <li><a class="nav-link" href="fiscal.html"><i class="bi bi-cash-stack"></i> Gestion Fiscale</a></li>
            <li><a class="nav-link" href="autorisations.html"><i class="bi bi-file-earmark-text"></i> Autorisations</a></li>
            <li><a class="nav-link" href="dossiers.html"><i class="bi bi-folder2-open"></i> Dossiers</a></li>
            <li><a class="nav-link" href="statistiques.html"><i class="bi bi-bar-chart"></i> Rapports</a></li>
            <li><a class="nav-link" href="parametres.html"><i class="bi bi-gear"></i> Paramètres</a></li>
        </ul>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="topbar">
            <h4>Dashboard</h4>
            <span>Admin <i class="bi bi-person-circle fs-4"></i></span>
        </div>
        
        <div class="row">
            <div class="col-md-3 mb-3">
                <div class="stat-card blue">
                    <h6>Total Recettes</h6>
                    <h3>1599,50 €</h3>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="stat-card green">
                    <h6>Nombre de dossiers</h6>
                    <h3>23</h3>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="stat-card orange">
                    <h6>En cours</h6>
                    <h3>13</h3>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="stat-card red">
                    <h6>En retard</h6>
                    <h3>9</h3>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
