<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Tableau de Bord</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h2 class="mb-4 text-info">📊 Tableau de Bord et Statistiques</h2>
        <div class="row">
            <div class="col-md-3"><div class="card text-bg-success mb-3"><div class="card-body"><h5>Recettes Fiscales</h5><h2>1,250,000 DH</h2></div></div></div>
            <div class="col-md-3"><div class="card text-bg-primary mb-3"><div class="card-body"><h5>Dossiers</h5><h2>2,430</h2></div></div></div>
            <div class="col-md-3"><div class="card text-bg-warning mb-3"><div class="card-body"><h5>En Retard</h5><h2>580</h2></div></div></div>
            <div class="col-md-3"><div class="card text-bg-info mb-3"><div class="card-body"><h5>Autorisations</h5><h2>1,120</h2></div></div></div>
        </div>
        <div class="card shadow-sm"><div class="card-header">Evolution des Recettes Mensuelles</div><div class="card-body"><p>Graphique Chart.js viendra ici</p></div></div>
    </div>
</body>
</html>
