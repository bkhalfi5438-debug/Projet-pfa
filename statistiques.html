A

<section class="content">

<div class="row g-4">

<div class="col-md-6">

<div class="table-card">

<h5>
Recettes mensuelles
</h5>

<canvas id="monthlyChart"></canvas>

</div>

</div>


<div class="col-md-6">

<div class="table-card">

<h5>
Autorisations par type
</h5>

<canvas id="authorizationChart"></canvas>

</div>

</div>


<div class="col-md-6">

<div class="table-card">

<h5>
Taxes par catégorie
</h5>

<canvas id="taxChart"></canvas>

</div>

</div>


<div class="col-md-6">

<div class="table-card">

<h5>
Dossiers par statut
</h5>

<canvas id="statusChart"></canvas>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<script>

new Chart(
document.getElementById("monthlyChart"),
{

type: "bar",

data: {

labels: [
"Jan",
"Fév",
"Mars",
"Avr",
"Mai",
"Juin"
],

datasets: [{

label: "Recettes",

data: [
500000,
620000,
710000,
850000,
1000000,
1250000
],

borderWidth: 1

}]

}

});


new Chart(
document.getElementById("authorizationChart"),
{

type: "bar",

data: {

labels: [
"Construction",
"Commerce",
"Occupation",
"Enseigne"
],

datasets: [{

label: "Nombre",

data: [
120,
90,
65,
45
],

borderWidth: 1

}]

}

});


new Chart(
document.getElementById("taxChart"),
{

type: "doughnut",

data: {

labels: [
"Professionnelle",
"Foncière",
"Services",
"Autres"
],

datasets: [{

data: [
40,
25,
20,
15
],

borderWidth: 1

}]

}

});


new Chart(
document.getElementById("statusChart"),
{

type: "bar",

data: {

labels: [
"Acceptés",
"En attente",
"Refusés"
],

datasets: [{

label: "Dossiers",

data: [
1800,
430,
200
],

borderWidth: 1

}]

}

});

</script>
