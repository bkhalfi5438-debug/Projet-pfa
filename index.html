<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Plateforme sécurisée de gestion et d'analyse des données fiscales et des autorisations municipales">

    <meta name="author"
          content="Administration Municipale">

    <title>
        Administration Municipale | Connexion
    </title>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


    <!-- =====================================================
         CSS DU PROJET
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body class="login-body">


    <!-- =====================================================
         BACKGROUND DECORATION
    ====================================================== -->

    <div class="background-decoration background-decoration-1"></div>

    <div class="background-decoration background-decoration-2"></div>


    <!-- =====================================================
         PAGE DE CONNEXION
    ====================================================== -->

    <main class="login-page">


        <!-- =================================================
             LOGIN CONTAINER
        ================================================== -->

        <div class="login-container">


            <!-- =============================================
                 LOGIN CARD
            ============================================== -->

            <section class="login-card">


                <!-- =========================================
                     HEADER / LOGO
                ========================================== -->

                <div class="login-header">


                    <!-- Logo -->

                    <div class="logo-container">

                        <div class="logo-circle">

                            <i class="bi bi-building-fill"></i>

                        </div>

                    </div>


                    <!-- Titre -->

                    <h1 class="login-title">

                        Administration Municipale

                    </h1>


                    <!-- Sous-titre -->

                    <p class="login-subtitle">

                        Plateforme de Gestion et d'Analyse
                        des Données Fiscales et des Autorisations

                    </p>

                </div>



                <!-- =========================================
                     SEPARATOR
                ========================================== -->

                <div class="login-separator">

                    <span></span>

                </div>



                <!-- =========================================
                     FORMULAIRE
                ========================================== -->

                <form
                    id="loginForm"
                    action="#"
                    method="POST"
                    autocomplete="off">


                    <!-- =====================================
                         IDENTIFIANT
                    ====================================== -->

                    <div class="form-group mb-4">

                        <label
                            for="username"
                            class="form-label">

                            <i class="bi bi-person-fill me-2"></i>

                            Email professionnel / Identifiant

                        </label>


                        <div class="input-wrapper">

                            <i class="bi bi-person input-icon"></i>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="form-control custom-input"
                                placeholder="Entrez votre identifiant"
                                autocomplete="username"
                                required>

                        </div>

                    </div>



                    <!-- =====================================
                         MOT DE PASSE
                    ====================================== -->

                    <div class="form-group mb-3">

                        <label
                            for="password"
                            class="form-label">

                            <i class="bi bi-lock-fill me-2"></i>

                            Mot de passe

                        </label>


                        <div class="input-wrapper">

                            <i class="bi bi-lock input-icon"></i>


                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control custom-input password-input"
                                placeholder="Entrez votre mot de passe"
                                autocomplete="current-password"
                                required>


                            <!-- Bouton afficher/cacher -->

                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle"
                                aria-label="Afficher le mot de passe">

                                <i
                                    class="bi bi-eye"
                                    id="eyeIcon">
                                </i>

                            </button>

                        </div>

                    </div>



                    <!-- =====================================
                         OPTIONS
                    ====================================== -->

                    <div class="login-options">


                        <!-- Se souvenir -->

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="rememberMe"
                                name="rememberMe">

                            <label
                                class="form-check-label"
                                for="rememberMe">

                                Se souvenir de moi

                            </label>

                        </div>


                        <!-- Mot de passe oublié -->

                        <a
                            href="#"
                            class="forgot-password">

                            Mot de passe oublié ?

                        </a>

                    </div>



                    <!-- =====================================
                         MESSAGE D'ERREUR / SUCCÈS
                    ====================================== -->

                    <div
                        id="loginMessage"
                        class="login-message d-none"
                        role="alert">

                    </div>



                    <!-- =====================================
                         BOUTON CONNEXION
                    ====================================== -->

                    <button
                        type="submit"
                        id="loginButton"
                        class="btn login-btn">

                        <span class="login-btn-text">

                            <i class="bi bi-box-arrow-in-right me-2"></i>

                            Se connecter

                        </span>

                        <span
                            class="login-loading d-none">

                            <span
                                class="spinner-border spinner-border-sm me-2"
                                role="status"
                                aria-hidden="true">
                            </span>

                            Connexion...

                        </span>

                    </button>



                    <!-- =====================================
                         SECURITY INFO
                    ====================================== -->

                    <div class="security-info">

                        <i class="bi bi-shield-lock-fill"></i>

                        <span>
                            Connexion sécurisée
                        </span>

                    </div>


                </form>



                <!-- =========================================
                     FOOTER CARD
                ========================================== -->

                <div class="login-footer">

                    <p>
                        © 2026 Administration Municipale
                    </p>

                    <span>
                        Plateforme interne de gestion municipale
                    </span>

                </div>


            </section>


        </div>


    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        src="js/login.js">
    </script>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
