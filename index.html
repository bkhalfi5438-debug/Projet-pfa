<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administration Municipale - Connexion</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-card">

            <div class="logo-container">
                <div class="municipality-logo">
                    🏛️
                </div>

                <h2>Administration Municipale</h2>

                <p>
                    Plateforme de Gestion et d'Analyse des Données Fiscales
                    et des Autorisations
                </p>
            </div>

            <form id="loginForm">

                <div class="mb-3">
                    <label class="form-label">
                        Email professionnel / Identifiant
                    </label>

                    <input
                        type="text"
                        id="email"
                        class="form-control"
                        placeholder="Entrez votre identifiant"
                        required>
                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="••••••••"
                        required>

                </div>

                <div class="form-check mb-3">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="remember">

                    <label class="form-check-label">
                        Se souvenir de moi
                    </label>

                </div>

                <button
                    type="submit"
                    class="btn login-btn w-100">

                    Se connecter

                </button>

                <div class="text-center mt-3">

                    <a href="#" class="forgot-password">
                        Mot de passe oublié ?
                    </a>

                </div>

            </form>

            <div class="login-footer">
                <small>
                    © 2026 Administration Municipale
                </small>
            </div>

        </div>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {

            e.preventDefault();

            window.location.href = "dashboard.html";

        });
    </script>

</body>

</html>
