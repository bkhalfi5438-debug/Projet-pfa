<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Plateforme de gestion et d'analyse des données fiscales et des autorisations municipales">

    <meta name="author"
          content="Administration Municipale">

    <title>Administration Municipale | Connexion</title>


    <!-- ================================
         BOOTSTRAP
    ================================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- ================================
         BOOTSTRAP ICONS
    ================================= -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- ================================
         GOOGLE FONT
    ================================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


    <!-- ================================
         CSS DU PROJET
    ================================= -->

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body class="login-body">


    <!-- ================================
         DECORATIONS BACKGROUND
    ================================= -->

    <div class="background-decoration background-decoration-1"></div>

    <div class="background-decoration background-decoration-2"></div>

    <div class="background-decoration background-decoration-3"></div>


    <!-- DOTS GAUCHE -->

    <div class="dots dots-left">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>


    <!-- DOTS DROITE -->

    <div class="dots dots-right">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>


    <!-- ================================
         PAGE PRINCIPALE
    ================================= -->

    <main class="login-page">


        <!-- ================================
             LOGIN CONTAINER
        ================================= -->

        <div class="login-container">


            <!-- ================================
                 LOGIN CARD
            ================================= -->

            <section class="login-card">


                <!-- ================================
                     HEADER
                ================================= -->

                <header class="login-header">


                    <!-- LOGO MUNICIPALITE -->

                    <div class="logo-container">

                        <img
                            src="images/logos-municipalite.jpg"
                            alt="Logo de la Municipalité"
                            class="municipal-logo">

                    </div>


                    <!-- TITRE -->

                    <h1 class="login-title">
                        Administration Municipale
                    </h1>


                    <!-- SOUS-TITRE -->

                    <p class="login-subtitle">

                        Plateforme de Gestion et d'Analyse des Données
                        <br>
                        Fiscales et des Autorisations

                    </p>

                </header>



                <!-- ================================
                     SEPARATOR
                ================================= -->

                <div class="login-separator">

                    <span></span>

                    <div class="separator-dot"></div>

                    <span></span>

                </div>



                <!-- ================================
                     FORMULAIRE
                ================================= -->

                <form
                    id="loginForm"
                    action="#"
                    method="POST"
                    autocomplete="off">


                    <!-- ============================
                         IDENTIFIANT
                    ============================= -->

                    <div class="form-group">


                        <label
                            for="username"
                            class="form-label">

                            Email professionnel / Identifiant

                        </label>


                        <div class="input-wrapper">

                            <div class="input-icon-box">

                                <i class="bi bi-person"></i>

                            </div>


                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="custom-input"
                                placeholder="Entrez votre identifiant"
                                autocomplete="username"
                                required>

                        </div>

                    </div>



                    <!-- ============================
                         MOT DE PASSE
                    ============================= -->

                    <div class="form-group password-group">


                        <label
                            for="password"
                            class="form-label">

                            Mot de passe

                        </label>


                        <div class="input-wrapper">


                            <div class="input-icon-box">

                                <i class="bi bi-lock"></i>

                            </div>


                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="custom-input password-input"
                                placeholder="Entrez votre mot de passe"
                                autocomplete="current-password"
                                required>


                            <!-- AFFICHER MOT DE PASSE -->

                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle"
                                aria-label="Afficher le mot de passe">

                                <i
                                    class="bi bi-eye"
                                    id="eyeIcon">
                                </i>

                            </button>


                        </div>

                    </div>



                    <!-- ============================
                         OPTIONS
                    ============================= -->

                    <div class="login-options">


                        <!-- SE SOUVENIR -->

                        <div class="remember-container">

                            <input
                                type="checkbox"
                                id="rememberMe"
                                name="rememberMe"
                                class="remember-checkbox">


                            <label
                                for="rememberMe"
                                class="remember-label">

                                Se souvenir de moi

                            </label>

                        </div>


                        <!-- MOT DE PASSE OUBLIE -->

                        <a
                            href="#"
                            class="forgot-password">

                            Mot de passe oublié ?

                        </a>

                    </div>



                    <!-- ============================
                         MESSAGE
                    ============================= -->

                    <div
                        id="loginMessage"
                        class="login-message d-none"
                        role="alert">

                    </div>



                    <!-- ============================
                         BOUTON CONNEXION
                    ============================= -->

                    <button
                        type="submit"
                        id="loginButton"
                        class="login-btn">


                        <!-- ETAT NORMAL -->

                        <span
                            id="loginBtnText"
                            class="login-btn-text">

                            <i class="bi bi-box-arrow-in-right"></i>

                            Se connecter

                        </span>


                        <!-- ETAT LOADING -->

                        <span
                            id="loginLoading"
                            class="login-loading d-none">

                            <span
                                class="spinner-border spinner-border-sm"
                                role="status"
                                aria-hidden="true">
                            </span>

                            Connexion...

                        </span>


                    </button>



                    <!-- ============================
                         SECURITE
                    ============================= -->

                    <div class="security-info">


                        <div class="security-icon">

                            <i class="bi bi-shield-lock-fill"></i>

                        </div>


                        <span>
                            Connexion sécurisée
                        </span>


                    </div>


                </form>



                <!-- ================================
                     FOOTER
                ================================= -->

                <footer class="login-footer">


                    <p class="copyright">

                        © 2026 Administration Municipale

                    </p>


                    <p class="footer-description">

                        Plateforme de gestion municipale

                    </p>


                </footer>


            </section>


        </div>


    </main>



    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script src="js/login.js"></script>


    <!-- BOOTSTRAP JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
