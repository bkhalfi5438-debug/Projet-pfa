<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Administration</title>
    <base href="/Projet-pfa/">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/admin.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <div class="sidebar">
        <div class="sidebar-header"><i class="bi bi-building"></i><h6>Administration<br><small>Fiscale</small></h6></div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link active" href="index.html"><i class="bi bi-grid"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="pages/fiscal.html"><i class="bi bi-cash-stack"></i> Gestion Fiscale</a></li>
            <li class="nav-item"><a class="nav-link" href="pages/autorisations.html"><i class="bi bi-file-earmark-text"></i> Autorisations</a></li>
        </ul>
    </div>
    <div class="main-content">
        <div class="topbar"><h4>Dashboard</h4><div class="user-info">Admin <i class="bi bi-person-circle fs-4"></i></div></div>
        <div class="row">
            <div class="col-md-3"><div class="stat-card blue"><h6>Total Recettes</h6><h3 id="totalRecettes">0 DH</h3></div></div>
            <div class="col-md-3"><div class="stat-card green"><h6>Nombre de dossiers</h6><h3 id="totalDossiers">0</h3></div></div>
            <div class="col-md-3"><div class="stat-card orange"><h6>En cours</h6><h3 id="enCours">0</h3></div></div>
            <div class="col-md-3"><div class="stat-card red"><h6>En retard</h6><h3 id="enRetard">0</h3></div></div>
        </div>
        <div class="row mt-4">
            <div class="col-md-8"><div class="card p-3"><h6>Evolution recettes fiscales</h6><canvas id="lineChart" height="100"></canvas></div></div>
            <div class="col-md-4"><div class="card p-3"><h6>Statut Autorisations</h6><canvas id="pieChart" height="100"></canvas></div></div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
